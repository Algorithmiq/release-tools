# License policy "open-source" of the license-check action: what an open-source library
# under Apache-2.0 (or a similar permissive license) may depend on, for anchore/grant
# (https://oss.anchore.com/docs/guides/license/policies/). From AEGISS's .grant.yaml.
#
# Matching is case-sensitive and `*` is a glob. A package must match on every license it
# declares: several license entries, or an AND expression, must all be allowed, while an
# OR expression passes as soon as one alternative is, which is intended: the project
# takes the allowed option (MIT in `MIT OR GPL-3.0-only`). A package that fails is
# ignored with its reason in the repository's `ignore-packages`.
#
# The action appends the repository's `ignore-packages`: keep that key out of this file.

allow:
  # Permissive
  - 0BSD
  - Apache-2.0
  # An SPDX exception only adds permissions, but grant matches a whole `<license> WITH
  # <exception>` expression, so each one needs its own entry, reviewed one by one.
  - Apache-2.0 WITH LLVM-exception
  - BSD-*-Clause
  - CC0-1.0
  - ISC
  - MIT
  - MIT-CMU
  - PSF-2.0
  - Python-2.0
  - Unlicense
  - Zlib
  # Weak copyleft: fine for unmodified dependencies installed alongside the package, not
  # for code copied into it.
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MPL-2.0
  # Trove classifiers, for packages that declare no SPDX identifier
  - "License :: OSI Approved :: Apache Software License"
  - "License :: OSI Approved :: BSD License"
  - "License :: OSI Approved :: MIT License"
  - "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"

# A package without any license fails: ignore it with its reason once its license is known.
require-license: true
