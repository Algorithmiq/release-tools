# CHANGELOG.md is generated from PR descriptions by the release bot: no hook checks it.
exclude = "^CHANGELOG\\.md$"
default_language_version.python = "python3"
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files", args = ["--maxkb=512"] },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "trailing-whitespace", exclude = "\\.diff$" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "debug-statements" },
    { id = "name-tests-test", args = ["--pytest-test-first"], exclude = "^tests/conftest\\.py$" },
]

# ruff and ty run from the project environment (`just build`), so that uv.lock is their
# only pin, the one Dependabot's uv ecosystem bumps, and `just fmt`, `just typecheck` and
# `just lint` run the same versions. The hooks mirror astral-sh/ruff-pre-commit and
# astral-sh/ty-pre-commit.
[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", language = "system", entry = "uv run --no-sync ruff check --force-exclude", types_or = ["python", "pyi", "jupyter"], require_serial = true },
    { id = "ruff-format", name = "ruff format", language = "system", entry = "uv run --no-sync ruff format --check --force-exclude", types_or = ["python", "pyi", "jupyter", "markdown"], require_serial = true },
    # ty checks the whole project, whatever files changed: a change in one file can
    # break the types of another, and a deletion too.
    { id = "ty", name = "ty", language = "system", entry = "uv run --no-sync ty check --quiet", pass_filenames = false, always_run = true, require_serial = true },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.6"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"
hooks = [
    { id = "insert-license", name = "check Python license header", types = ["python"], args = [
        "--license-filepath", ".github/license-header.txt", "--comment-style", "#",
    ] },
]

# Workflows: this repository's and the examples. actionlint also runs shellcheck on the
# run: blocks; .github/actionlint.yaml lists its known false positives. The hook installs
# its own environment, so shellcheck-py is pinned here and in pyproject.toml: keep both.
[[repos]]
repo = "https://github.com/Mateusz-Grzelinski/actionlint-py"
rev = "v1.7.12.25"
hooks = [
    { id = "actionlint", files = "^(\\.github/workflows|examples/.*/\\.github/workflows|examples/stubs)/.*\\.ya?ml$", additional_dependencies = ["shellcheck-py==0.11.0.1"] },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.39.0"
hooks = [
    { id = "check-dependabot" },
    { id = "check-github-workflows", files = "^(\\.github/workflows|examples/.*/\\.github/workflows|examples/stubs)/.*\\.ya?ml$" },
    { id = "check-github-actions", files = "^actions/[^/]+/action\\.ya?ml$" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "pin-actions-exactly", name = "pin actions to exact tags (vX.Y.Z)", language = "pygrep", entry = "uses:\\s*[^\\s@]+@v[0-9]+(\\.[0-9]+)?\\s*$", files = "^(\\.github|actions|examples)/.*\\.ya?ml$" },
    # Needs gh with access to the organisation; skipped without it. Only at pre-push: the
    # names come from the organisation, which CI can't list.
    { id = "no-internal-names", name = "no names of non-public Algorithmiq repositories", language = "system", entry = "uv run --no-sync python scripts/check_internal_names.py", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
