name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the tools
        run: just build
      - name: Run the hooks
        run: just lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the tools
        run: just build
      - name: Run the tests
        run: just test

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the tools
        run: just build
      - name: Build the documentation site
        run: just docs-build

  # The composite actions on a real runner. release-tools has no runtime dependencies:
  # its SBOM lists only itself.
  actions:
    name: actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: sbom
        uses: ./actions/sbom
      - name: Check the SBOM
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
        run: |
          jq -e '.metadata.component.name == "release-tools"' "$SBOM_PATH/release-tools.cdx.json"
