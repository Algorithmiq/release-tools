# Reusable workflow: automates releases as described in the "Branching Model and Release
# Management" guide. Called from a repository's .github/workflows/release.yml stub, which
# owns the triggers (see README.md):
#
#   Start release (manual, from main)  -> creates release/X.Y
#   Push to release/X.Y                -> tags a release candidate (until X.Y.0 is out)
#                                         and opens/updates the release PR
#   Release PR merged                  -> tags the final release
#   Final tag pushed                   -> copies CHANGELOG.md back to main
#
# Publishing (build, GitHub release, PyPI) is done by the repository's publish
# workflow, which runs on every v* tag and can use the actions in actions/.
#
# The github context is the caller's. release.py and cliff.toml come from this
# repository, checked out at the commit the caller pinned (job.workflow_repository and
# job.workflow_sha), so the workflow logic and its files always have the same version.

name: Release (reusable)

on:
  workflow_call:
    inputs:
      client-id:
        description: Client ID of the release bot GitHub App (vars.RELEASE_BOT_CLIENT_ID).
        type: string
        required: true
      bump:
        description: Kind of release to start (minor or major); only used on workflow_dispatch.
        type: string
        required: false
        default: minor
      version-files:
        description: >-
          Files that hold the version number (space-separated). Plain files like VERSION
          are overwritten; *.toml files get their [project] version updated. Empty if the
          version comes from the git tag (setuptools-scm, hatch-vcs).
        type: string
        required: false
        default: ""
    secrets:
      private-key:
        description: Private key of the release bot GitHub App (secrets.RELEASE_BOT_PRIVATE_KEY).
        required: true

permissions:
  contents: read

env:
  VERSION_FILES: ${{ inputs.version-files }}
  # Where this repository is checked out, inside the caller's working tree.
  RELEASE_TOOLS: ${{ github.workspace }}/.release-tools

jobs:
  start:
    name: Start release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
      # Read-only access to this repository, which may be internal or private.
      - id: tools-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ job.workflow_repository }}
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Check out release-tools at the version the caller pinned
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          token: ${{ steps.tools-token.outputs.token }}
          persist-credentials: false
      - id: next
        run: python3 "$RELEASE_TOOLS/release.py" start --bump "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}
      # Pushing the branch (with the bot's token) triggers the "update" job below,
      # which tags the first release candidate and opens the release PR.
      - run: git push origin "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.next.outputs.branch }}
      - run: echo "Started $BRANCH (v$VERSION)." >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: ${{ steps.next.outputs.branch }}
          VERSION: ${{ steps.next.outputs.version }}

  update:
    name: Tag and update release PR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
      - id: tools-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ job.workflow_repository }}
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Check out release-tools at the version the caller pinned
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          token: ${{ steps.tools-token.outputs.token }}
          persist-credentials: false
      - name: Use the release bot's identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - run: pipx install git-cliff==2.14.2

      - id: plan
        run: python3 "$RELEASE_TOOLS/release.py" plan

      # Tags pushed with the bot's token trigger the publish workflow.
      - name: Tag release candidate
        if: steps.plan.outputs.action == 'rc'
        run: python3 "$RELEASE_TOOLS/release.py" tag "$VERSION"
        env:
          VERSION: ${{ steps.plan.outputs.tag_version }}
      - name: Tag final release
        if: steps.plan.outputs.action == 'final'
        env:
          VERSION: ${{ steps.plan.outputs.tag_version }}
          SERIES: ${{ steps.plan.outputs.series }}
        run: |
          python3 "$RELEASE_TOOLS/release.py" tag "$VERSION" --final
          git push origin --delete "release-pr/$SERIES" || true

      - name: Open or update the release PR
        if: steps.plan.outputs.action == 'rc' || steps.plan.outputs.action == 'pr'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PENDING: ${{ steps.plan.outputs.pending }}
          SERIES: ${{ steps.plan.outputs.series }}
          BASE: ${{ github.ref_name }}
        run: |
          pr_branch="release-pr/$SERIES"
          title="chore: release v$PENDING"
          git checkout -B "$pr_branch" "$GITHUB_SHA"

          python3 "$RELEASE_TOOLS/release.py" set-version "$PENDING"
          [ -f CHANGELOG.md ] || touch CHANGELOG.md
          cliff=(git cliff --config "$RELEASE_TOOLS/cliff.toml" --unreleased --tag "v$PENDING")
          "${cliff[@]}" --prepend CHANGELOG.md
          "${cliff[@]}" --strip header > "$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2086 # VERSION_FILES is a space-separated list
          git add CHANGELOG.md $VERSION_FILES
          git commit --quiet -m "$title"
          git push --quiet --force origin "$pr_branch"

          {
            echo "Merging this PR releases **v$PENDING**."
            echo
            echo "It is updated automatically whenever a change lands on \`$BASE\`."
            echo "Wording fixes to \`CHANGELOG.md\` can be pushed to this PR, but make them"
            echo "just before merging: the next update overwrites them."
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"

          number=$(gh pr list --head "$pr_branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$pr_branch" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  sync-changelog:
    name: Copy changelog to main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Use the release bot's identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          branch="changelog/$TAG"
          git checkout -B "$branch"
          git checkout "$TAG" -- CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md on main is already up to date."
            exit 0
          fi
          git commit --quiet -m "chore: update changelog for $TAG"
          git push --quiet --force origin "$branch"
          gh pr create --head "$branch" --base main \
            --title "chore: update changelog for $TAG" \
            --body "Copies \`CHANGELOG.md\` from the $TAG release to \`main\`."
          gh pr merge "$branch" --squash --auto \
            || echo "::warning::Could not enable auto-merge; merge the PR by hand."
