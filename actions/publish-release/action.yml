name: Publish release
description: >-
  Publish the draft GitHub release of a v* tag. Run it last, after every upload (PyPI)
  has succeeded: with immutable releases, publishing locks the tag and the files and
  creates GitHub's release attestation. Needs contents write permission.

inputs:
  tag:
    description: The tag whose draft release to publish. Defaults to the tag that triggered the run.
    required: false
    default: ""
  token:
    description: Token with contents write permission on the repository.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        tag="${TAG:-$GITHUB_REF_NAME}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.([0-9]+|0(a|b|rc)[0-9]+)$ ]]; then
          echo "::error::'$tag' is not a release tag (vX.Y.Z, or vX.Y.0aN, bN or rcN)."
          exit 1
        fi
        gh release edit "$tag" --draft=false
