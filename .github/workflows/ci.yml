name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install the tools
        run: just build
      - name: Run the hooks
        run: just lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install the tools
        run: just build
      - name: Run the tests
        run: just test
