name: Publish release
description: >-
  Publish the draft GitHub release of a v* tag. Run it last, after every upload (PyPI)
  has succeeded: with immutable releases, publishing locks the tag and the files and
  creates GitHub's release attestation. It publishes only if the tag has exactly one
  draft, and does nothing if the tag is already published. Needs contents write permission.

inputs:
  tag:
    description: The tag whose draft release to publish. Defaults to the tag that triggered the run.
    required: false
    default: ""
  token:
    description: Token with contents write permission on the repository.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        tag="${TAG:-$GITHUB_REF_NAME}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.([0-9]+|0(a|b|rc)[0-9]+)$ ]]; then
          echo "::error::'$tag' is not a release tag (vX.Y.Z, or vX.Y.0aN, bN or rcN)."
          exit 1
        fi

        # Publish the draft by its id: `gh release edit "$tag"` picks one of several
        # drafts of a tag in an undocumented way, and could publish an incomplete one.
        releases=$(gh api --paginate "repos/$GH_REPO/releases" \
          --jq '.[] | [.id, .tag_name, .draft] | @tsv')
        drafts=()
        published=false
        while read -r id name draft; do
          if [[ "$name" == "$tag" && "$draft" == true ]]; then
            drafts+=("$id")
          elif [[ "$name" == "$tag" ]]; then
            published=true
          fi
        done <<< "$releases"
        # A re-run after the release was published has nothing left to do.
        if [[ ${#drafts[@]} -eq 0 && "$published" == true ]]; then
          echo "The release $tag is already published."
          exit 0
        fi
        if [[ ${#drafts[@]} -ne 1 ]]; then
          echo "::error::Found ${#drafts[@]} draft releases of $tag, expected exactly one: run draft-release (again) first."
          exit 1
        fi
        gh api -X PATCH "repos/$GH_REPO/releases/${drafts[0]}" -F draft=false
