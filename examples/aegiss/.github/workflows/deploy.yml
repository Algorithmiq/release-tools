name: Publish AEGISS to PyPI

# Runs on the v* tags that release.yml pushes, as the release guide prescribes: build,
# draft the GitHub release with every file attached, publish to PyPI, then publish the
# GitHub release, which makes it immutable. Never on `release: published`. The release
# steps come from Algorithmiq/release-tools, at the version release.yml pins.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a publish run must never be cut short half-way through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  COLUMNS: 120

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs reads the tags

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Build distributions
        run: just dist

      - name: Check the version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheels=(dist/*.whl)
          actual="$(basename "${wheels[0]}" | cut -d- -f2)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::built version is '$actual', but the release tag is '$expected'"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

      # A separate artifact: the PyPI upload takes everything in dist/
      - name: Generate the SBOMs
        run: just sbom

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom/*

  draft_release:
    # Immutable releases: files can only be attached while the release is a draft.
    name: Create the draft GitHub release with the distributions and SBOMs
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # git-cliff needs the full history and the tags

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Release notes from the changelog
        id: notes
        uses: Algorithmiq/release-tools/actions/release-notes@v1.0.0

      - name: Create the draft release
        uses: Algorithmiq/release-tools/actions/draft-release@v1.0.0
        with:
          notes-file: ${{ steps.notes.outputs.path }}
          files: |
            dist/*
            sbom/*

  upload_pypi:
    name: Upload to PyPI
    needs: draft_release
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  publish_release:
    # Publishing locks the tag and the files and creates GitHub's release attestation.
    name: Publish the GitHub release
    needs: upload_pypi
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        uses: Algorithmiq/release-tools/actions/publish-release@v1.0.0
